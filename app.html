<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CountsFor: understand what every CMU-Q course counts for across CS, IS, Business, and Biology majors." />
  <meta name="theme-color" content="#C41230" />
  <title>CountsFor: CMU-Q Curriculum Explorer</title>
  <link rel="icon" type="image/png" href="docs/scotty-standing.png" />
  <link rel="apple-touch-icon" href="docs/scotty-standing.png" />
  <meta name="cf-build" content="2026-08-10-navbar-v1" />
  <link rel="stylesheet" href="css/styles.css?v=2026-08-10-navbar-v1" />
  <style>
    /* Keep Directory FAB above the home footer even if styles.css is cached */
    body.view-home .directory-fab { bottom: 96px !important; }
    body.view-home .home-foot-note { padding-right: 170px; }
    @media (max-width: 768px) {
      body.view-home .directory-fab { bottom: 116px !important; }
    }
  </style>
  <!--
    Google OAuth web client ID. Create one at
    https://console.cloud.google.com/apis/credentials and paste the value
    below. Authorized JavaScript origins must include both the local dev
    URL (http://localhost:8765) and https://hindjendara.github.io
  -->
  <!--
    After Render deploy, paste your service URL (no trailing slash).
    Likely: https://countsfor-backend.onrender.com
  -->
  <meta name="cf-backend-url" content="https://countsfor-summer-26.onrender.com" />
  <link rel="preconnect" href="https://countsfor-summer-26.onrender.com" crossorigin />
  <script>
    // Wake the free-tier backend as early as possible (fire-and-forget).
    (function () {
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '') return; // local dev uses localhost:5050
      var meta = document.querySelector('meta[name="cf-backend-url"]');
      var url = meta && meta.getAttribute('content');
      if (url) fetch(url.replace(/\/$/, '') + '/health', { mode: 'no-cors', cache: 'no-store' }).catch(function () {});
    })();
  </script>
  <meta name="cf-google-client-id" content="378923997481-bgnvhg3gsgka5ptijjjsb80q4k7kc2vg.apps.googleusercontent.com" />
  <!-- Google Identity Services. REQUIRED for "Continue with Google" — without
       it window.google never loads and the sign-in button silently does nothing. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <div class="empty-state" style="height:100vh">
      <div class="spinner"></div>
      <div class="empty-text" style="margin-top:12px">Loading CountsFor…</div>
    </div>
  </div>
  <script src="js/utils.js?v=2026-08-10-navbar-v1"></script>
  <script src="js/data.js?v=2026-08-10-navbar-v1"></script>
  <script src="js/profile.js?v=2026-08-10-navbar-v1"></script>
  <script src="js/api.js?v=2026-08-10-navbar-v1"></script>
  <script src="js/app.js?v=2026-08-10-navbar-v1"></script>
</body>
</html>
