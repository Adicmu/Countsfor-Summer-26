<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CountsFor — Find out which requirements any course satisfies, all in one place." />
  <meta name="theme-color" content="#F5F0EA" />
  <meta name="cf-backend-url" content="https://countsfor-summer-26.onrender.com" />
  <title>CountsFor — CMU-Q Curriculum Explorer</title>
  <link rel="icon" type="image/png" href="docs/scotty-portrait.png" />
  <link rel="apple-touch-icon" href="docs/scotty-portrait.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/landing.css?v=auth-v1" />
  <style>
    /* Critical layout — keeps GH Pages sizing correct even if the stylesheet is cached late */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .auth-shell {
      box-sizing: border-box;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2vh, 32px) 16px;
      gap: clamp(8px, 2vh, 24px);
    }
    .landing-brand,
    .landing-card,
    #landingCard {
      box-sizing: border-box;
      width: 100%;
      max-width: 400px;
    }
    @media (max-height: 599px) {
      html, body { overflow-y: auto; }
      .auth-shell { height: auto; min-height: 100dvh; overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="auth-shell wrap">
    <header class="landing-brand">
      <img
        class="landing-brand__scotty"
        src="docs/scotty-portrait.png"
        alt="Scotty, the Carnegie Mellon University mascot"
        width="96"
        height="96"
        decoding="async"
      />
      <div class="landing-brand__rule" aria-hidden="true"></div>
      <p class="landing-brand__eyebrow">CMU-Q CURRICULUM EXPLORER</p>
      <h1 class="landing-brand__wordmark">CountsFor</h1>
      <p class="landing-brand__tagline">
        Find out which requirements any course satisfies, all in one place.
      </p>
    </header>

    <main class="landing-card" id="landingCard" aria-live="polite">
      <!-- Sign in / Create account / Forgot / Reset panels rendered by js/landing.js -->
    </main>
  </div>
  <script src="js/landing.js?v=auth-v1"></script>
</body>
</html>
