<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CountsFor — See what courses count for at CMU-Q, in the majors and in General Education." />
  <meta name="theme-color" content="#C41230" />
  <meta name="cf-backend-url" content="https://countsfor-summer-26.onrender.com" />
  <meta name="cf-google-client-id" content="378923997481-bgnvhg3gsgka5ptijjjsb80q4k7kc2vg.apps.googleusercontent.com" />
  <!-- Google Identity Services — used on the landing for Google-based password recovery. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>CountsFor — CMU-Q Curriculum Explorer</title>
  <link rel="icon" type="image/png" href="docs/scotty-portrait.png" />
  <link rel="apple-touch-icon" href="docs/scotty-portrait.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body>
  <div class="landing-page wrap">
    <div class="landing-page__inner">
      <header class="landing-brand">
        <img
          class="landing-brand__scotty"
          src="docs/scotty-portrait.png"
          alt="Scotty, the Carnegie Mellon University mascot"
          width="96"
          height="96"
          decoding="async"
        />
        <div class="landing-brand__rule" aria-hidden="true"></div>
        <p class="landing-brand__eyebrow">CMU-Q CURRICULUM EXPLORER</p>
        <h1 class="landing-brand__wordmark">CountsFor</h1>
        <p class="landing-brand__tagline">
          See what courses count for at CMU-Q — in the majors and in General Education.
        </p>
      </header>

      <main class="landing-card" id="landingCard" aria-live="polite">
        <!-- Sign in / Create account / Forgot / Reset panels rendered by js/landing.js -->
      </main>

      <div class="landing-guest-row">
        <button type="button" id="cfGuestBtn" class="landing-guest">Continue as guest →</button>
        <p class="landing-guest-note">Browse every course and requirement — nothing is saved to a server.</p>
      </div>
    </div>
  </div>
  <script src="js/landing.js"></script>
</body>
</html>
