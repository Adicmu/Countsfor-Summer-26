# Render Blueprint (repo root). Use when creating services via Blueprint.
# If you already have Countsfor-Summer-26 + CountsFor_Summer_2026, fix the
# existing web service Settings instead (see docs/RENDER_FIX.md).

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m backend.bootstrap_db
    startCommand: SKIP_DB_BOOTSTRAP=1 gunicorn --workers=1 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: CountsFor_Summer_2026
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        value: hjendara@andrew.cmu.edu
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu
      - key: FRONTEND_ORIGIN
        value: https://adicmu.github.io,https://hindjendara.github.io,http://localhost:8765
      - key: SEED_USERS_PATH
        value: ../data/faculty_directory.json

      # ── Password-reset email (Gmail SMTP). Secrets are set in the Render
      #    dashboard; see docs/SETUP_AUTH.md "Reset emails via Gmail". ──
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # the Gmail address that sends reset emails
      - key: SMTP_PASSWORD
        sync: false          # 16-char Google App Password (not the account password)
      - key: PUBLIC_APP_URL
        value: https://adicmu.github.io/Countsfor-Summer-26/

databases:
  - name: CountsFor_Summer_2026
    plan: free
    region: ohio
