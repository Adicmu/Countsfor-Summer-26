# Render Blueprint — single source of truth for CountsFor backend deploy.
# Database: CountsFor_Summer_2026 (ohio). Do not use backend/render.yaml (removed).

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: ohio
    # Repo root (Option A): preDeploy/start run python -m backend.* from here.
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m backend.bootstrap_db
    startCommand: SKIP_DB_BOOTSTRAP=1 gunicorn --workers=1 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: CountsFor_Summer_2026
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        value: ""
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu
      - key: FRONTEND_ORIGIN
        value: https://adicmu.github.io,https://hindjendara.github.io,http://localhost:8765
      - key: SEED_USERS_PATH
        value: data/faculty_directory.json
      # ── Password-reset email. Configure ONE provider in the dashboard (see
      #    docs/SETUP_AUTH.md "Reset emails"). Until then the forgot view
      #    steers users to Google recovery — nothing looks broken.
      #    Resend API: RESEND_API_KEY + MAIL_FROM.
      #    Gmail SMTP: SMTP_HOST=smtp.gmail.com, SMTP_USER=<gmail address>,
      #                SMTP_PASS=<16-char Google App Password>.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_RESET_BASE
        value: https://adicmu.github.io/Countsfor-Summer-26/index.html

databases:
  - name: CountsFor_Summer_2026
    plan: free
    region: ohio
