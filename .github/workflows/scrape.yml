name: Scrape SOC

on:
  schedule:
    # Daily at 12:00 UTC (~3pm Qatar / ~7am US East)
    - cron: '0 12 * * *'
    # Extra runs during typical registration months (valid GitHub cron only)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SOC scraper
        run: python data/scrape_soc.py

      - name: Reconcile offerings into bundled course data
        run: python data/reconcile_offerings.py

      - name: Apply manual requirement mapping overlays
        run: python data/apply_mapping_overlays.py

      - name: Validate SOC coverage in CountsFor catalog
        run: python data/validate_soc_coverage.py

      - name: Commit data if it changed
        run: |
          git config user.name  "soc-bot"
          git config user.email "soc-bot@users.noreply.github.com"
          git add data/soc.json data/courses.json data_all_courses.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Update SOC data ($(date -u +%Y-%m-%d))"
            git push
          fi
