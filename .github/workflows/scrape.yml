name: Scrape SOC

on:
  schedule:
    # Daily at 12:00 UTC (~3pm Qatar / ~7am US East)
    - cron: '0 12 * * *'
    # Weekday morning run during registration season
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

# Full scrape + reconcile can run 30–90 minutes on CI.
concurrency:
  group: soc-scrape-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scrape:
    if: github.repository == 'Adicmu/Countsfor-Summer-26'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SOC parser tests
        run: python -m pytest data/tests/test_scrape_soc.py data/tests/test_soc_parse.py -q

      - name: Run SOC scraper
        run: python data/scrape_soc.py

      - name: Reconcile offerings into bundled course data
        run: python data/reconcile_offerings.py

      - name: Apply manual requirement mapping overlays
        run: python data/apply_mapping_overlays.py

      - name: Validate SOC coverage in CountsFor catalog
        run: python data/validate_soc_coverage.py

      - name: Bump frontend cache tag for fresh courses.json
        run: python scripts/bump_cf_build.py

      - name: Commit data if it changed
        id: commit
        run: |
          git config user.name  "soc-bot"
          git config user.email "soc-bot@users.noreply.github.com"
          git add data/soc.json data/courses.json data_all_courses.json app.html
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update SOC data ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # SOC bot pushes do not trigger pages.yml; redeploy explicitly.
      - name: Deploy updated data to GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
