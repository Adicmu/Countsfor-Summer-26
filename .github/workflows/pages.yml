name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for in-progress Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            status=$(gh api "repos/${{ github.repository }}/pages/deployments" --jq '.[0].status' 2>/dev/null || echo "unknown")
            echo "Latest Pages deployment status: ${status} (attempt ${attempt}/20)"
            if [ "$status" != "in_progress" ] && [ "$status" != "queued" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Pages deployment queue"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait and retry Pages deploy
        if: steps.deployment.outcome != 'success'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@v4
