name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-adicmu
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Adicmu/Countsfor-Summer-26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          single-commit: true

      - name: Point GitHub Pages at gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
