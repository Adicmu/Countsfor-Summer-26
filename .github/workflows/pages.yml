name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only what the browser loads. Backend code, docs, tests and
      # raw scrape data stay in the repo but are not served publicly.
      - name: Collect public site files
        run: |
          mkdir -p _site/data
          cp index.html app.html reset.html .nojekyll _site/
          cp -R js css assets landing _site/
          rm -f _site/landing/*.md
          cp data/courses.json data/minor_courses.json _site/data/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
