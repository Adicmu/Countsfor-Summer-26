# Render Blueprint — one-click deploy.
# Reference: https://render.com/docs/blueprint-spec
#
# After connecting this repo in the Render dashboard, the values marked
# `sync: false` need to be filled in manually (secrets). The free Postgres
# add-on expires after 90 days on free tier — set a calendar reminder.

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: oregon            # closest free region; latency to Qatar is OK for v1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: cd .. && python -m backend.bootstrap_db
    startCommand: cd .. && SKIP_DB_BOOTSTRAP=1 gunicorn --workers=1 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9

      # Auto-wired from the Postgres add-on below
      - key: DATABASE_URL
        fromDatabase:
          name: countsfor-db
          property: connectionString

      # Auto-generated by Render — never commit a real value
      - key: SECRET_KEY
        generateValue: true

      # ── Secrets you set manually in the Render dashboard ──
      - key: GOOGLE_CLIENT_ID
        sync: false           # e.g. "1234567890-abc.apps.googleusercontent.com"
      - key: ADMIN_EMAILS
        value: hjendara@andrew.cmu.edu,avivek@andrew.cmu.edu,hbouamor@andrew.cmu.edu,spessoa@andrew.cmu.edu
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu

      # CORS — browser origin is https://hindjendara.github.io (no path)
      - key: FRONTEND_ORIGIN
        value: https://hindjendara.github.io,http://localhost:8765

      # Optional: commit backend/seed_users.json with faculty emails
      - key: SEED_USERS_PATH
        value: ../data/faculty_directory.json

      # Password-reset email (SMTP). Set these in the Render dashboard to enable
      # real reset emails. Leave SMTP_HOST empty and password reset reports as
      # unavailable instead of silently failing.
      - key: SMTP_HOST
        sync: false           # e.g. smtp.gmail.com  /  smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false           # SMTP username (full email, or "apikey" for SendGrid)
      - key: SMTP_PASSWORD
        sync: false           # SMTP password / app password / API key
      - key: SMTP_FROM
        sync: false           # From address shown to recipients (defaults to SMTP_USER)
      # Public URL of the deployed frontend, used to build the reset link:
      - key: PUBLIC_APP_URL
        value: https://adicmu.github.io/Countsfor-Summer-26/

databases:
  - name: countsfor-db
    plan: free
    region: oregon
    databaseName: countsfor
    user: countsfor
