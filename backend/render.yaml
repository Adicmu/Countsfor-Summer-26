# Render Blueprint — one-click deploy.
# Reference: https://render.com/docs/blueprint-spec
#
# After connecting this repo in the Render dashboard, the values marked
# `sync: false` need to be filled in manually (secrets). The free Postgres
# add-on expires after 90 days on free tier — set a calendar reminder.

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: oregon            # closest free region; latency to Qatar is OK for v1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: cd .. && python -m backend.bootstrap_db
    startCommand: cd .. && SKIP_DB_BOOTSTRAP=1 gunicorn --workers=1 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9

      # Auto-wired from the Postgres add-on below
      - key: DATABASE_URL
        fromDatabase:
          name: countsfor-db
          property: connectionString

      # Auto-generated by Render — never commit a real value
      - key: SECRET_KEY
        generateValue: true

      # ── Secrets you set manually in the Render dashboard ──
      - key: GOOGLE_CLIENT_ID
        sync: false           # e.g. "1234567890-abc.apps.googleusercontent.com"
      - key: ADMIN_EMAILS
        value: hjendara@andrew.cmu.edu,avivek@andrew.cmu.edu,hbouamor@andrew.cmu.edu,spessoa@andrew.cmu.edu
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu

      # CORS — browser origin is https://hindjendara.github.io (no path)
      - key: FRONTEND_ORIGIN
        value: https://hindjendara.github.io,http://localhost:8765

      # Optional: commit backend/seed_users.json with faculty emails
      - key: SEED_USERS_PATH
        value: ../data/faculty_directory.json

      # Password reset email (Resend preferred; SMTP fallback)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false          # e.g. "CountsFor <onboarding@yourdomain.com>"
      # Optional SMTP fallback: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
      # Dev-only: EXPOSE_RESET_TOKEN=1 returns token in API response
      # Optional: FRONTEND_RESET_BASE=https://your.pages.github.io/Countsfor-Summer-26/reset.html

databases:
  - name: countsfor-db
    plan: free
    region: oregon
    databaseName: countsfor
    user: countsfor
