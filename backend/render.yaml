# Render Blueprint — one-click deploy.
# Reference: https://render.com/docs/blueprint-spec
#
# After connecting this repo in the Render dashboard, the values marked
# `sync: false` need to be filled in manually (secrets). The free Postgres
# add-on expires after 90 days on free tier — set a calendar reminder.

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: oregon            # closest free region; latency to Qatar is OK for v1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # gunicorn imports `backend.app` from the repo root, so we cd up one level.
    startCommand: cd .. && gunicorn --workers=2 --bind 0.0.0.0:$PORT --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9

      # Auto-wired from the Postgres add-on below
      - key: DATABASE_URL
        fromDatabase:
          name: countsfor-db
          property: connectionString

      # Auto-generated by Render — never commit a real value
      - key: SECRET_KEY
        generateValue: true

      # ── Secrets you set manually in the Render dashboard ──
      - key: GOOGLE_CLIENT_ID
        sync: false           # e.g. "1234567890-abc.apps.googleusercontent.com"
      - key: ADMIN_EMAILS
        sync: false           # e.g. "avivek@andrew.cmu.edu,ladyhodhod@andrew.cmu.edu"
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu # leave empty to allow any verified Google account

      # CORS allow-list — update if the frontend ever moves off GH Pages
      - key: FRONTEND_ORIGIN
        value: https://adicmu.github.io,http://localhost:8765

databases:
  - name: countsfor-db
    plan: free
    region: oregon
    databaseName: countsfor
    user: countsfor
