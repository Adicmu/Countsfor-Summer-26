# Render web service only — use with Supabase Postgres

# Deploy: Render dashboard → New → Blueprint → pick this file instead of render.yaml
# Then set DATABASE_URL manually to your Supabase Session pooler URI.

services:
  - type: web
    name: countsfor-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd .. && gunicorn --workers=2 --bind 0.0.0.0:$PORT --access-logfile - 'backend.app:create_app()'
    healthCheckPath: /health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: andrew.cmu.edu
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SEED_USERS_PATH
        value: backend/seed_users.json
